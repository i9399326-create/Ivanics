<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>MyChat</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,Roboto,sans-serif;background:#0f0f1a;color:#eee;
       height:100dvh;display:flex;flex-direction:column}
  header{padding:14px 16px;background:#1a1a2e;display:flex;justify-content:space-between;
         align-items:center;border-bottom:1px solid #252542;flex-shrink:0}
  header h1{font-size:18px;font-weight:600}
  header button{background:none;border:none;color:#8b8bff;font-size:14px;padding:6px 10px}
  .menu-btn{font-size:22px;color:#8b8bff;padding:0 8px}
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .hidden{display:none!important}
  .auth{padding:24px;justify-content:center;gap:12px}
  .auth h2{font-size:22px;text-align:center;margin-bottom:8px}
  .auth input{padding:14px;background:#1a1a2e;border:1px solid #2a2a4a;
              border-radius:10px;color:#eee;font-size:16px;outline:none}
  .auth input:focus{border-color:#8b8bff}
  .auth button{padding:14px;background:#5b5bff;border:none;border-radius:10px;
               color:#fff;font-size:16px;font-weight:600;margin-top:8px}
  .auth .switch{color:#8b8bff;text-align:center;font-size:14px;padding:8px}
  .err{color:#ff5c5c;font-size:14px;text-align:center;min-height:20px}
  .tabs{display:flex;background:#1a1a2e;border-bottom:1px solid #252542;flex-shrink:0}
  .tabs button{flex:1;padding:14px;background:none;border:none;color:#888;font-size:15px;
               border-bottom:2px solid transparent}
  .tabs button.active{color:#8b8bff;border-bottom-color:#8b8bff}
  .list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .item{padding:14px 16px;border-bottom:1px solid #1a1a2e;display:flex;gap:12px;
        align-items:center;cursor:pointer}
  .item:active{background:#1a1a2e}
  .avatar{width:44px;height:44px;border-radius:50%;background:#5b5bff;color:#fff;
          display:flex;align-items:center;justify-content:center;font-size:18px;
          font-weight:600;flex-shrink:0;overflow:hidden;
          background-size:cover;background-position:center}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .item-info{flex:1;min-width:0}
  .item-info .name{font-size:15px;font-weight:500;margin-bottom:2px}
  .item-info .sub{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;
                  text-overflow:ellipsis}
  .empty{padding:40px 20px;text-align:center;color:#666;font-size:14px}
  .chat-header{padding:12px 16px;background:#1a1a2e;display:flex;align-items:center;
               gap:12px;border-bottom:1px solid #252542;flex-shrink:0}
  .chat-header .back{background:none;border:none;color:#8b8bff;font-size:22px;padding:0 4px}
  .chat-header .call-btn{background:none;border:none;color:#4CAF50;font-size:22px;
                         padding:6px 10px;margin-left:auto}
  .messages{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;
            gap:6px;-webkit-overflow-scrolling:touch}
  .msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:15px;
       word-wrap:break-word;line-height:1.35}
  .msg.mine{align-self:flex-end;background:#5b5bff;color:#fff;border-bottom-right-radius:4px}
  .msg.theirs{align-self:flex-start;background:#252542;border-bottom-left-radius:4px}
  .msg audio{max-width:200px;display:block}
  .msg .time{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
  .composer{padding:10px 12px;background:#1a1a2e;border-top:1px solid #252542;
            display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
            padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .composer textarea{flex:1;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:20px;
                     color:#eee;font-size:15px;padding:10px 14px;resize:none;outline:none;
                     font-family:inherit;max-height:100px;line-height:1.35}
  .composer textarea:focus{border-color:#8b8bff}
  .composer button{width:44px;height:44px;border-radius:50%;border:none;
                   background:#5b5bff;color:#fff;font-size:18px;flex-shrink:0;
                   display:flex;align-items:center;justify-content:center}
  .composer button:disabled{background:#333}
  .attach{background:none!important;color:#8b8bff!important;font-size:22px!important}
  .attach.rec{color:#ff5c5c!important;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .loading{padding:40px;text-align:center;color:#666}

  .overlay{position:fixed;top:0;left:0;width:100%;height:100%;
           background:rgba(15,15,26,.97);display:flex;flex-direction:column;
           justify-content:center;align-items:center;gap:20px;z-index:9999}
  .call-btn-lg{color:#fff;padding:14px 32px;border:none;border-radius:12px;
               font-size:16px;font-weight:600}
  .side-panel{position:fixed;top:0;left:0;width:280px;height:100%;background:#1a1a2e;
              z-index:10000;padding:24px 20px;display:flex;flex-direction:column;
              gap:16px;transform:translateX(-100%);transition:transform .25s;
              border-right:1px solid #252542;overflow-y:auto}
  .side-panel.open{transform:translateX(0)}
  .side-panel h2{font-size:20px;margin-bottom:12px}
  .side-panel label{font-size:13px;color:#888;display:block;margin-top:8px}
  .side-panel input{padding:10px;background:#0f0f1a;border:1px solid #2a2a4a;
                    border-radius:8px;color:#eee;font-size:15px;outline:none;width:100%}
  .side-panel .big-avatar{width:80px;height:80px;border-radius:50%;background:#5b5bff;
                          display:flex;align-items:center;justify-content:center;
                          font-size:32px;font-weight:600;margin:0 auto 12px;
                          background-size:cover;background-position:center;overflow:hidden}
  .side-panel .big-avatar img{width:100%;height:100%;object-fit:cover}
  .side-panel button{padding:12px;background:#5b5bff;border:none;border-radius:10px;
                     color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .side-panel .ghost{background:none;border:1px solid #2a2a4a;color:#8b8bff}
  .side-panel .danger{background:#f44336}
  .backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);
            z-index:9999;display:none}
  .backdrop.show{display:block}
</style>
</head><body>
<div id="app">
  <header id="topbar" class="hidden">
    <button class="menu-btn" id="menuBtn">☰</button>
    <h1>MyChat</h1>
    <div style="width:40px"></div>
  </header>

  <div id="authScreen" class="screen auth">
    <h2 id="authTitle">Вход</h2>
    <input id="nameInput" class="hidden" placeholder="Ваше имя" autocomplete="name">
    <input id="emailInput" type="email" placeholder="Email" autocomplete="email">
    <input id="passInput" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button id="authBtn">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</div>
  </div>

  <div id="mainScreen" class="screen hidden">
    <div class="tabs">
      <button id="tabChats" class="active">Чаты</button>
      <button id="tabUsers">Люди</button>
    </div>
    <div id="listView" class="list"></div>
  </div>

  <div id="chatScreen" class="screen hidden">
    <div class="chat-header">
      <button class="back" id="backBtn">←</button>
      <div class="avatar" id="peerAvatar">?</div>
      <div class="item-info"><div class="name" id="peerName">...</div></div>
      <button class="call-btn" id="callBtn">📞</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="attach" id="voiceBtn">🎤</button>
      <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
      <button id="sendBtn" disabled>➤</button>
    </div>
  </div>
</div>

<div id="incomingCallModal" class="overlay hidden">
  <div class="avatar" id="incomingAvatar" style="width:90px;height:90px;font-size:36px">?</div>
  <h2 id="incomingName">Звонок</h2>
  <p style="color:#888">Входящий звонок...</p>
  <div style="display:flex;gap:16px">
    <button class="call-btn-lg" id="acceptCallBtn" style="background:#4CAF50">Принять</button>
    <button class="call-btn-lg" id="declineCallBtn" style="background:#f44336">Отклонить</button>
  </div>
</div>

<div id="activeCallModal" class="overlay hidden">
  <div class="avatar" id="activeAvatar" style="width:100px;height:100px;font-size:42px">?</div>
  <h2 id="activeName">...</h2>
  <p id="callStatus" style="color:#888">Соединение...</p>
  <button class="call-btn-lg" id="endCallBtn" style="background:#f44336">Завершить</button>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="side-panel" id="sidePanel">
  <h2>Настройки</h2>
  <div class="big-avatar" id="myAvatar">?</div>
  <button class="ghost" id="changeAvatarBtn">Сменить аватар</button>
  <input type="file" id="avatarInput" accept="image/*" style="display:none">
  <label>Имя</label>
  <input id="settingsName" placeholder="Ваше имя">
  <label>Email</label>
  <input id="settingsEmail" disabled style="opacity:.5">
  <button id="saveProfileBtn">Сохранить</button>
  <label>Новый пароль</label>
  <input id="newPassword" type="password" placeholder="Оставьте пустым, чтобы не менять">
  <button class="ghost" id="changePasswordBtn">Сменить пароль</button>
  <hr style="border:none;border-top:1px solid #252542;margin:12px 0">
  <button class="danger" id="logoutBtn">Выйти из аккаунта</button>
  <button class="ghost" id="closePanelBtn">Закрыть</button>
   </div><script>
const { Client, Account, Databases, Storage, ID, Query } = Appwrite;

const client = new Client()
  .setEndpoint('https://fra.cloud.appwrite.io/v1')
  .setProject('6abbddff0015669790bf');

const DB_ID    = '6abbe1eb001c12fd2855';
const PROFILES = 'profiles';
const MESSAGES = 'messages';
const CALLS    = 'calls';
const BUCKET   = 'chat-files';

const account   = new Account(client);
const databases = new Databases(client);
const storage   = new Storage(client);

const $ = id => document.getElementById(id);
let me = null, myProfile = null, currentChat = null,
    unsubMsgs = null, unsubList = null, isLogin = true;

function show(screen){
  ['authScreen','mainScreen','chatScreen'].forEach(s => $(s).classList.add('hidden'));
  $(screen).classList.remove('hidden');
  $('topbar').classList.toggle('hidden', screen === 'authScreen');
}

function fileUrl(fileId){
  if (!fileId) return '';
  return 'https://fra.cloud.appwrite.io/v1/storage/buckets/'+BUCKET+'/files/'+fileId+'/view?project='+client.config.project;
}

function setAvatar(el, name, avatarId){
  if (!el) return;
  if (avatarId){
    el.style.backgroundImage = 'url('+fileUrl(avatarId)+')';
    el.textContent = '';
  } else {
    el.style.backgroundImage = '';
    el.textContent = (name||'?')[0].toUpperCase();
  }
}

function esc(s){ return (s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// ==================== АВТОРИЗАЦИЯ ====================
$('authSwitch').onclick = () => {
  isLogin = !isLogin;
  $('authTitle').textContent = isLogin ? 'Вход' : 'Регистрация';
  $('authBtn').textContent   = isLogin ? 'Войти' : 'Создать аккаунт';
  $('authSwitch').textContent = isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
  $('nameInput').classList.toggle('hidden', isLogin);
  $('authErr').textContent = '';
};

async function ensureProfile(user, nameHint){
  try {
    const res = await databases.listDocuments(DB_ID, PROFILES, [
      Query.equal('userId', user.$id), Query.limit(1)
    ]);
    if (res.documents.length) return res.documents[0];
  } catch(e){ console.warn('check profile:', e.message); }

  try {
    return await databases.createDocument(DB_ID, PROFILES, ID.unique(), {
      userId: user.$id,
      name: nameHint || user.name || (user.email || '').split('@')[0] || 'Без имени',
      email: user.email || '',
      avatarId: ''
    });
  } catch(e){ console.warn('create profile:', e.message); return null; }
}

$('authBtn').onclick = async () => {
  const email = $('emailInput').value.trim();
  const pass  = $('passInput').value;
  const name  = $('nameInput').value.trim();
  $('authErr').textContent = '';
  $('authBtn').disabled = true;
  try {
    try { await account.deleteSession('current'); } catch(e){}
    if (isLogin){
      await account.createEmailPasswordSession(email, pass);
      const u = await account.get();
      await ensureProfile(u, name);
    } else {
      const user = await account.create(ID.unique(), email, pass, name || 'Без имени');
      await ensureProfile(user, name);
      await account.createEmailPasswordSession(email, pass);
    }
    location.reload();
  } catch(e){
    $('authErr').textContent = e.message || 'Ошибка';
  } finally { $('authBtn').disabled = false; }
};

$('logoutBtn').onclick = async () => {
  try { await account.deleteSession('current'); } catch(e){}
  location.reload();
};

// ==================== НАСТРОЙКИ ====================
function openPanel(){
  $('sidePanel').classList.add('open');
  $('backdrop').classList.add('show');
  if (myProfile){
    $('settingsName').value = myProfile.name || '';
    $('settingsEmail').value = myProfile.email || '';
    setAvatar($('myAvatar'), myProfile.name, myProfile.avatarId);
  }
}
function closePanel(){
  $('sidePanel').classList.remove('open');
  $('backdrop').classList.remove('show');
}
$('menuBtn').onclick = openPanel;
$('closePanelBtn').onclick = closePanel;
$('backdrop').onclick = closePanel;

$('changeAvatarBtn').onclick = () => $('avatarInput').click();
$('avatarInput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  if (!myProfile) return;
  try {
    const file = new File([f], 'avatar_'+me.$id+'_'+Date.now()+'.jpg', { type: f.type });
    const up = await storage.createFile(BUCKET, ID.unique(), file);
    await databases.updateDocument(DB_ID, PROFILES, myProfile.$id, { avatarId: up.$id });
    myProfile.avatarId = up.$id;
    setAvatar($('myAvatar'), myProfile.name, myProfile.avatarId);
    alert('Аватар обновлён');
  } catch(err){ alert('Ошибка загрузки: ' + err.message); }
};

$('saveProfileBtn').onclick = async () => {
  if (!myProfile) return;
  const newName = $('settingsName').value.trim();
  if (!newName){ alert('Имя не может быть пустым'); return; }
  try {
    await databases.updateDocument(DB_ID, PROFILES, myProfile.$id, { name: newName });
    myProfile.name = newName;
    alert('Сохранено');
    closePanel();
  } catch(e){ alert('Ошибка: ' + e.message); }
};

$('changePasswordBtn').onclick = async () => {
  const np = $('newPassword').value;
  if (np.length < 8){ alert('Пароль должен быть не короче 8 символов'); return; }
  try {
    await account.updatePassword(np);
    $('newPassword').value = '';
    alert('Пароль изменён');
  } catch(e){ alert('Ошибка: ' + e.message); }
};

// ==================== СТАРТ ====================
(async () => {
  try {
    const u = await account.get();
    me = u;
    myProfile = await ensureProfile(u);
    show('mainScreen');
    loadUsers();
    startCallsListener();
  } catch(e) {
    show('authScreen');
  }
})();// ==================== СПИСКИ ====================
function chatIdFor(a,b){ return [a,b].sort().join('_'); }

$('tabChats').onclick = () => {
  $('tabChats').classList.add('active'); $('tabUsers').classList.remove('active');
  loadChats();
};
$('tabUsers').onclick = () => {
  $('tabUsers').classList.add('active'); $('tabChats').classList.remove('active');
  loadUsers();
};

async function loadUsers(){
  if (unsubList){ unsubList(); unsubList = null; }
  const list = $('listView');
  list.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const res = await databases.listDocuments(DB_ID, PROFILES, [Query.limit(100)]);
    const users = res.documents.filter(d => d.userId !== me.$id);
    if (!users.length){ list.innerHTML = '<div class="empty">Пока никого нет</div>'; return; }
    list.innerHTML = '';
    users.forEach(u => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<div class="avatar"></div>
        <div class="item-info"><div class="name">${esc(u.name||'?')}</div>
        <div class="sub">${esc(u.email||'')}</div></div>`;
      setAvatar(el.querySelector('.avatar'), u.name, u.avatarId);
      el.onclick = () => openChat(chatIdFor(me.$id, u.userId), u.name || 'Чат', u.userId, u.avatarId);
      list.appendChild(el);
    });
  } catch(e){
    list.innerHTML = '<div class="empty">Ошибка: '+esc(e.message)+'</div>';
  }
}

async function loadChats(){
  if (unsubList){ unsubList(); unsubList = null; }
  const list = $('listView');
  list.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const res = await databases.listDocuments(DB_ID, MESSAGES, [
      Query.orderDesc('createdAt'), Query.limit(200)
    ]);
    const seen = new Set();
    const chats = [];
    res.documents.forEach(m => {
      if (!m.chatId) return;
      if (m.chatId.indexOf(me.$id) === -1) return;
      if (seen.has(m.chatId)) return;
      seen.add(m.chatId);
      chats.push(m);
    });
    if (!chats.length){ list.innerHTML = '<div class="empty">Начните чат во вкладке «Люди»</div>'; return; }
    list.innerHTML = '';
    for (const c of chats){
      const parts = c.chatId.split('_');
      const peerId = parts.find(p => p !== me.$id);
      if (!peerId) continue;
      let uname = 'Чат', uavatar = '';
      try {
        const pr = await databases.listDocuments(DB_ID, PROFILES, [Query.equal('userId', peerId), Query.limit(1)]);
        if (pr.documents.length){
          uname = pr.documents[0].name || 'Чат';
          uavatar = pr.documents[0].avatarId || '';
        }
      } catch(e){}
      const el = document.createElement('div');
      el.className = 'item';
      const preview = c.type === 'voice' ? '🎤 Голосовое' : (c.text || '');
      el.innerHTML = `<div class="avatar"></div>
        <div class="item-info"><div class="name">${esc(uname)}</div>
        <div class="sub">${esc(preview)}</div></div>`;
      setAvatar(el.querySelector('.avatar'), uname, uavatar);
      el.onclick = () => openChat(c.chatId, uname, peerId, uavatar);
      list.appendChild(el);
    }
  } catch(e){
    list.innerHTML = '<div class="empty">Ошибка: '+esc(e.message)+'</div>';
  }
}

// ==================== ЧАТ ====================
async function openChat(chatId, peerName, peerId, peerAvatar){
  currentChat = { chatId, peerId, peerName };
  $('peerName').textContent = peerName;
  setAvatar($('peerAvatar'), peerName, peerAvatar);
  show('chatScreen');
  $('messages').innerHTML = '<div class="loading">Загрузка...</div>';

  if (unsubMsgs){ unsubMsgs(); unsubMsgs = null; }
  await loadMessages(chatId);

  try {
    unsubMsgs = await client.subscribe(
      'databases.'+DB_ID+'.tables.'+MESSAGES+'.rows',
      () => { loadMessages(chatId); }
    );
  } catch(e){ console.warn('realtime:', e); }
}

async function loadMessages(chatId){
  try {
    const res = await databases.listDocuments(DB_ID, MESSAGES, [
      Query.equal('chatId', chatId),
      Query.orderAsc('createdAt'),
      Query.limit(200)
    ]);
    const box = $('messages');
    box.innerHTML = '';
    if (!res.documents.length){
      box.innerHTML = '<div class="empty">Сообщений пока нет</div>';
      return;
    }
    res.documents.forEach(m => {
      const mine = m.senderId === me.$id;
      const el = document.createElement('div');
      el.className = 'msg ' + (mine ? 'mine' : 'theirs');
      let inner = '';
      if (m.type === 'voice' && m.fileId){
        inner += '<audio controls src="'+fileUrl(m.fileId)+'"></audio>';
      } else if (m.text){
        inner += esc(m.text);
      }
      const t = m.createdAt ? new Date(m.createdAt) : null;
      if (t) inner += '<div class="time">'+t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div>';
      el.innerHTML = inner;
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e){
    $('messages').innerHTML = '<div class="empty">Ошибка: '+esc(e.message)+'</div>';
  }
}

$('backBtn').onclick = () => {
  if (unsubMsgs){ unsubMsgs(); unsubMsgs = null; }
  currentChat = null;
  show('mainScreen');
  $('tabChats').classList.add('active'); $('tabUsers').classList.remove('active');
  loadChats();
};

// ==================== ОТПРАВКА ====================
const msgInput = $('msgInput');
msgInput.addEventListener('input', () => {
  $('sendBtn').disabled = !msgInput.value.trim();
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
});

$('sendBtn').onclick = sendText;
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
});

async function sendText(){
  if (!currentChat) return;
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = ''; msgInput.style.height = 'auto';
  $('sendBtn').disabled = true;
  await writeMessage(text, '', 'text');
}

async function writeMessage(text, fileId, type){
  if (!currentChat) return;
  try {
    await databases.createDocument(DB_ID, MESSAGES, ID.unique(), {
      chatId: currentChat.chatId,
      senderId: me.$id,
      text: text || '',
      type: type || 'text',
      fileId: fileId || '',
      createdAt: new Date().toISOString()
    });
    await loadMessages(currentChat.chatId);
  } catch(e){ alert('Ошибка отправки: ' + e.message); }
}

// ==================== ГОЛОСОВЫЕ ====================
let mediaRecorder = null, audioChunks = [], isRecording = false;

$('voiceBtn').onclick = async () => {
  if (!currentChat) return;
  if (!isRecording){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        try {
          const file = new File([blob], 'voice_'+Date.now()+'.webm', { type: 'audio/webm' });
          const uploaded = await storage.createFile(BUCKET, ID.unique(), file);
          await writeMessage('', uploaded.$id, 'voice');
        } catch(e){ alert('Ошибка загрузки: '+e.message); }
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      $('voiceBtn').classList.add('rec');
      $('voiceBtn').textContent = '⏹';
    } catch(e){ alert('Нет доступа к микрофону: '+e.message); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    $('voiceBtn').classList.remove('rec');
    $('voiceBtn').textContent = '🎤';
  }
};

// ==================== ЗВОНКИ (WebRTC) ====================
let peerConnection = null, localStream = null, currentCall = null,
    callSub = null, currentCallListener = null;
let iAmCaller = false;
let addedCandidates = new Set();
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function ensureAudioEl(){
  let el = document.getElementById('remoteAudio');
  if (!el){
    el = document.createElement('audio');
    el.id = 'remoteAudio';
    el.autoplay = true;
    el.setAttribute('playsinline', '');
    el.style.display = 'none';
    document.body.appendChild(el);
  }
  return el;
}

function createPC(){
  peerConnection = new RTCPeerConnection(rtcConfig);

  peerConnection.ontrack = (e) => {
    const audioEl = ensureAudioEl();
    audioEl.srcObject = e.streams[0];
    audioEl.play().catch(err => {
      console.warn('audio play err:', err);
      document.body.addEventListener('touchstart', () => audioEl.play().catch(()=>{}), {once:true});
    });
  };

  peerConnection.onicecandidate = async (e) => {
    if (!e.candidate || !currentCall) return;
    const field = iAmCaller ? 'candidate' : 'candidate2';
    try {
      const fresh = await databases.getDocument(DB_ID, CALLS, currentCall.$id);
      const existing = fresh[field] || '';
      await databases.updateDocument(DB_ID, CALLS, currentCall.$id, {
        [field]: existing + JSON.stringify(e.candidate) + '\n'
      });
    } catch(err){ console.warn('cand save:', err.message); }
  };

  peerConnection.onconnectionstatechange = () => {
    const st = peerConnection && peerConnection.connectionState;
    console.log('PC:', st);
    if (st === 'connected') $('callStatus').textContent = 'Разговор';
    if (st === 'failed') $('callStatus').textContent = 'Соединение не удалось';
    if (st === 'disconnected') $('callStatus').textContent = 'Связь пропала';
  };

  return peerConnection;
}

function processRemoteCandidates(raw){
  if (!peerConnection || !raw) return;
  const lines = raw.split('\n').filter(l => l.trim());
  lines.forEach(line => {
    if (addedCandidates.has(line)) return;
    addedCandidates.add(line);
    try {
      const cand = JSON.parse(line);
      peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
    } catch(e){}
  });
}

async function startCall(){
  if (!currentChat) return;
  if (currentCall){ alert('Уже в звонке'); return; }

  iAmCaller = true;
  addedCandidates = new Set();

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const pc = createPC();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    currentCall = await databases.createDocument(DB_ID, CALLS, ID.unique(), {
      fromId: me.$id,
      toId: currentChat.peerId,
      callerName: (myProfile && myProfile.name) || 'Пользователь',
      status: 'ringing',
      sdp: JSON.stringify(offer),
      type: 'offer',
      candidate: '',
      candidate2: ''
    });

    $('activeName').textContent = currentChat.peerName;
    setAvatar($('activeAvatar'), currentChat.peerName, '');
    $('activeCallModal').classList.remove('hidden');
    $('callStatus').textContent = 'Исходящий звонок...';

    listenOwnCall(currentCall.$id);
  } catch(e){
    alert('Не удалось позвонить: ' + e.message);
    endCall(false);
  }
}

function listenOwnCall(callId){
  if (currentCallListener){ currentCallListener(); currentCallListener = null; }
  currentCallListener = client.subscribe(
    'databases.'+DB_ID+'.tables.'+CALLS+'.rows.'+callId,
    async (res) => {
      const call = res.payload;
      if (!call) return;

      const remoteField = iAmCaller ? 'candidate2' : 'candidate';
      processRemoteCandidates(call[remoteField]);

      if (iAmCaller && call.status === 'accepted' && call.sdp && call.type === 'answer'){
        if (peerConnection && !peerConnection.currentRemoteDescription){
          try {
            await peerConnection.setRemoteDescription(
              new RTCSessionDescription(JSON.parse(call.sdp))
            );
            $('callStatus').textContent = 'Соединение...';
          } catch(e){ console.warn('set remote answer:', e); }
        }
      }

      if (call.status === 'declined' || call.status === 'ended'){
        endCall(false);
      }
    }
  );
}

async function acceptCall(){
  if (!currentCall) return;
  iAmCaller = false;
  addedCandidates = new Set();

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const pc = createPC();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(
      new RTCSessionDescription(JSON.parse(currentCall.sdp))
    );
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await databases.updateDocument(DB_ID, CALLS, currentCall.$id, {
      status: 'accepted',
      sdp: JSON.stringify(answer),
      type: 'answer'
    });

    $('incomingCallModal').classList.add('hidden');
    $('activeName').textContent = currentCall.callerName || 'Звонок';
    setAvatar($('activeAvatar'), currentCall.callerName || '?', '');
    $('activeCallModal').classList.remove('hidden');
    $('callStatus').textContent = 'Соединение...';

    listenOwnCall(currentCall.$id);
  } catch(e){
    alert('Ошибка при приёме: ' + e.message);
    endCall(true);
  }
}

async function endCall(updateStatus){
  if (updateStatus && currentCall){
    try {
      await databases.updateDocument(DB_ID, CALLS, currentCall.$id, { status: 'ended' });
    } catch(e){}
  }
  if (peerConnection){ try { peerConnection.close(); } catch(e){} peerConnection = null; }
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (currentCallListener){ currentCallListener(); currentCallListener = null; }
  const audioEl = document.getElementById('remoteAudio');
  if (audioEl){ audioEl.srcObject = null; }
  currentCall = null;
  addedCandidates = new Set();
  $('activeCallModal').classList.add('hidden');
  $('incomingCallModal').classList.add('hidden');
}

$('callBtn').onclick = startCall;
$('acceptCallBtn').onclick = acceptCall;
$('declineCallBtn').onclick = async () => {
  if (currentCall){
    try {
      await databases.updateDocument(DB_ID, CALLS, currentCall.$id, { status: 'declined' });
    } catch(e){}
  }
  endCall(false);
};
$('endCallBtn').onclick = () => endCall(true);

async function startCallsListener(){
  try {
    callSub = await client.subscribe(
      'databases.'+DB_ID+'.tables.'+CALLS+'.rows',
      (res) => {
        const call = res.payload;
        if (!call) return;
        if (call.toId === me.$id && call.status === 'ringing'
            && !currentCall && call.type === 'offer'){
          currentCall = call;
          iAmCaller = false;
          $('incomingName').textContent = call.callerName || 'Звонок';
          setAvatar($('incomingAvatar'), call.callerName || '?', '');
          $('incomingCallModal').classList.remove('hidden');
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800; gain.gain.value = 0.1;
            osc.start();
            setTimeout(()=>{ try { osc.stop(); ctx.close(); } catch(e){} }, 600);
          } catch(e){}
        }
      }
    );
  } catch(e){ console.warn('calls sub:', e); }
}
</script>
